[package]
name = "eink-kindle"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "eink-host"
path = "src/host.rs"

[dependencies]
eink-core = { path = "../eink-core" }
rquickjs = { version = "0.13", features = ["bindgen", "array-buffer"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
libc = "0.2"
